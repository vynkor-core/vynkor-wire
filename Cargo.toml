[package]
name = "vynkor-wire"
version = "0.0.3"
edition = "2021"
rust-version = "1.85.0"
description = "Vynkor wire protocol: framing, frame MAC, and generated protobuf types shared by the kernel and its SDKs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/vynkor-core/vynkor-wire"

[dependencies]
prost = "0.14"
tokio = { version = "1", features = ["io-util", "time"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
nix = { version = "0.31", features = ["user"] }
crc32fast = "1"
zstd = "0.13"

# opt-in, off by default: only the manifest feature pulls these (V-01) —
# SDK consumers keep compiling neither serde nor serde_json nor semver.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
semver = { version = "1", optional = true }

[features]
manifest = ["dep:serde", "dep:serde_json", "dep:semver"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.14"
